---
- name: Configure web server
  hosts: webservers
  become: yes

  tasks:
    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure app directory exists
      file:
        path: /home/ec2-user/app
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Ensure Git is installed
      yum:
        name: git
        state: present

    - name: Clone or update app repository
      git:
        repo: https://github.com/PAIN83/devops-production-setup.git
        dest: /home/ec2-user/app
        force: yes
      become_user: ec2-user

    - name: Ensure Flask app container is running
      shell: |
        sudo systemctl stop nginx || true
        docker build -t devops-app /home/ec2-user/app/02-cicd-pipeline/
        docker stop devops-app-container || true
        docker rm devops-app-container || true
        docker run -d -p 80:5000 --name devops-app-container devops-app
      become_user: ec2-user
